name: build
on:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install flake8
      run: pip install "setuptools<82" flake8 flake8-import-order flake8-future-import flake8-commas flake8-logging-format flake8-quotes
    - name: Lint with flake8
      run: |
        flake8 --version
        flake8
  unit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dmoj
        ports:
          - 13306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('requirements.txt') }}
    - name: Install unit test dependencies
      run: |
        pip install wheel
        pip install -r requirements.txt
        pip install coverage
        cp .ci.settings.py dmoj/local_settings.py
    - name: Collect jsi18n
      run: python manage.py compilejsi18n
    - name: Run unit tests
      run: coverage run --source=. manage.py test judge urlshortener
    - name: Generate coverage report
      run: coverage xml
  migrations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('requirements.txt') }}
    - name: Install dependencies
      run: |
        pip install wheel
        pip install -r requirements.txt
        printf "DATABASES = {'default': {'ENGINE': 'django.db.backends.sqlite3', 'NAME': ':memory:'}}\nSTATIC_ROOT = '/tmp'\n" > dmoj/local_settings.py
    - name: Check for missing migrations
      run: python manage.py makemigrations --check --dry-run
    - name: Check new migrations are Django-generated
      run: |
        git fetch origin ${{ github.base_ref }} --depth=1
        new=$(git diff --name-only --diff-filter=A FETCH_HEAD HEAD -- '*/migrations/*.py' | grep -v '__init__.py')
        if [ -z "$new" ]; then
          echo "No new migration files added."
          exit 0
        fi
        fail=0
        while IFS= read -r f; do
          if ! grep -q '# Generated by Django' "$f"; then
            echo "FAIL: $f is missing the '# Generated by Django' header — run manage.py makemigrations instead of writing migrations by hand"
            fail=1
          fi
        done <<< "$new"
        exit $fail
  translations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('requirements.txt') }}
    - name: Install dependencies
      run: |
        pip install wheel
        pip install -r requirements.txt
        cp .ci.settings.py dmoj/local_settings.py
    - name: Install gettext
      run: sudo apt-get install -y gettext
    - name: Run makemessages
      run: python manage.py makemessages -a
    - name: Check for new or removed strings
      run: |
        diff=$(git diff -- locale/ | grep -E '^[+-][^+-]' | grep -v 'POT-Creation-Date')
        if [ -n "$diff" ]; then
          echo "locale .po files are out of date. Run ./manage.py makemessages -a and commit the result."
          git diff -- locale/
          exit 1
        fi
    - name: Check for fuzzy translations
      run: |
        if grep -rn '^#, fuzzy' locale/; then
          echo "Fuzzy translations found. Resolve them before merging."
          exit 1
        fi
    - name: Check for obsolete translations
      run: |
        if grep -rn '^#~' locale/; then
          echo "Obsolete translations found. Remove them or run makemessages with --no-obsolete."
          exit 1
        fi
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install npm packages
        run: npm ci
      - name: Build style.css
        run: ./make_style.sh
