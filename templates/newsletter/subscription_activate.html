{% extends "base.html" %}

{% block title %}{{ _('Newsletter') }} {{ newsletter.title }} {{ action }} {{ _('activate') }}{% endblock %}

{% block body %}
    <h1>{{ _('Newsletter') }} {{ newsletter.title }} {{ action }} {{ _('activate') }}</h1>
    <form enctype="multipart/form-data" method="post" action=".">
        {% csrf_token %}
        {{ form.as_p() }}
        <p><input id="id_submit" name="submit" type="submit" value="{{ _('Activate') }}"></p>
    </form>
{% endblock %}
